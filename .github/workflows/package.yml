name: Package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build wheel from source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install and verify the wheel outside the checkout
        run: |
          python -m pip install dist/*.whl
          python -I scripts/check_installed.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: python-distributions
          path: dist/*
          retention-days: 14
