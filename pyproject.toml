[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev4pg"
dynamic = ["version"]
description = "A self-developing JEV-based SQL database with JEV-powered NL2SQL"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "sqlglot>=30.18,<31"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
eval = ["pandas==3.0.6", "numpy==2.5.3"]
browser-test = ["playwright>=1.50,<2"]
dev = ["ruff==0.16.8"]

[project.urls]
Repository = "https://github.com/Sheltercosmo/jev4pg"
Documentation = "https://github.com/Sheltercosmo/jev4pg/tree/main/docs"
Issues = "https://github.com/Sheltercosmo/jev4pg/issues"

[project.scripts]
sdd = "sdd.cli:main"
jev4pg = "sdd.cli:main"
jevsd-pg = "sdd.cli:main"

[tool.setuptools.packages.find]
include = ["sdd*"]

[tool.setuptools.dynamic]
version = {attr = "sdd._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
sdd = ["web/*", "operators/manifest.json", "operators/examples.json", "postgres/*.sql", "postgres/*.control"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
