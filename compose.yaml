name: jevsd-pg

x-bundled-database: &bundled-database
  SDD_DB_HOST: postgres
  SDD_DB_PORT: "5432"
  SDD_DB_NAME: sdd
  SDD_DB_USER: sdd_app
  SDD_DB_SSLMODE: prefer
  SDD_DB_SSLROOTCERT: ""
  SDD_SQL_INTERFACE: "1"

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/postgres.Dockerfile
    environment:
      POSTGRES_DB: sdd
      POSTGRES_USER: sdd_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    ports: ["127.0.0.1:${SDD_POSTGRES_PORT:-5432}:5432"]
    volumes: [sdd_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdd_admin -d sdd"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    extends: {file: compose.services.yaml, service: migrate}
    environment:
      <<: *bundled-database
      SDD_ADMIN_DB_USER: sdd_admin
    depends_on:
      postgres: {condition: service_healthy}

  app:
    extends: {file: compose.services.yaml, service: app}
    environment: *bundled-database
    depends_on:
      migrate: {condition: service_completed_successfully}

  sql-worker:
    extends: {file: compose.services.yaml, service: sql-worker}
    environment: *bundled-database
    depends_on:
      migrate: {condition: service_completed_successfully}

  query-worker:
    extends: {file: compose.services.yaml, service: query-worker}
    environment: *bundled-database
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  sdd_pg:

secrets:
  postgres_password:
    file: ${SDD_SECRETS_DIR:-.secrets}/postgres_password
  app_password:
    file: ${SDD_SECRETS_DIR:-.secrets}/app_password
  api_tokens:
    file: ${SDD_SECRETS_DIR:-.secrets}/api_tokens.json
  typesafe_api_key:
    file: ${SDD_SECRETS_DIR:-.secrets}/typesafe_api_key
  jev_api_key:
    file: ${SDD_SECRETS_DIR:-.secrets}/jev_api_key
  llm_api_key:
    file: ${SDD_SECRETS_DIR:-.secrets}/llm_api_key
